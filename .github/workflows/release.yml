name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: bolt
            asset_name: bolt-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: bolt
            asset_name: bolt-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: bolt
            asset_name: bolt-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: bolt
            asset_name: bolt-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bolt.exe
            asset_name: bolt-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.artifact_name }} -DestinationPath ${{ matrix.asset_name }}
          $hash = (Get-FileHash ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -Encoding ascii -FilePath "${{ matrix.asset_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  build-windows-installer:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    needs: build-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build x86_64-pc-windows-msvc release
        run: cargo build --release

      - name: Install NSIS & EnVar plugin
        shell: pwsh
        run: |
          choco install nsis -y
          # Download EnVar plugin for system PATH manipulation
          $envarUrl = "https://github.com/GsNSIS/EnVar/releases/download/v0.3.3/EnVar-Plugin.zip"
          Invoke-WebRequest -Uri $envarUrl -OutFile EnVar-Plugin.zip
          Expand-Archive -Path EnVar-Plugin.zip -DestinationPath EnVarPlugin
          Copy-Item -Path "EnVarPlugin\Plugins\x86-unicode\EnVar.dll" -Destination "C:\Program Files (x86)\NSIS\Plugins\x86-unicode\" -Force
          if (Test-Path "C:\Program Files (x86)\NSIS\Plugins\x86-ansi") {
            Copy-Item -Path "EnVarPlugin\Plugins\x86-ansi\EnVar.dll" -Destination "C:\Program Files (x86)\NSIS\Plugins\x86-ansi\" -Force
          }

      - name: Compile NSIS installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" installer\bolt.nsi

      - name: Checksum NSIS installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash target\release\bolt-installer-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  bolt-installer-x64.exe" | Out-File -Encoding ascii -FilePath "target\release\bolt-installer-x64.exe.sha256"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bolt-installer-x64.exe
          path: |
            target/release/bolt-installer-x64.exe
            target/release/bolt-installer-x64.exe.sha256

  publish-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-windows-installer]
    steps:
      - uses: actions/checkout@v4
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Bolt ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
