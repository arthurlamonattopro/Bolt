[package]
name = "bolt"
version = "0.1.0"
edition = "2026"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
futures = "0.3"
node-semver = "1.0"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
flate2 = "1.0"
tar = "0.4"
tempfile = "3.12"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
regex = "1.10"
directories = "5.0"
indicatif = "0.17"
pathdiff = "0.2"

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.12"
